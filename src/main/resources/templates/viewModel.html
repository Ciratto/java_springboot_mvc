<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="en">
<head>
	<meta charset="UTF-8">
	<title th:text="${titulo}"></title>
</head>
<body>
	<h1 th:text="${mensaje}"></h1>
	<ul>
	    <li>Usuario: <span th:text="${user.name}"></span></li>
	    <li>Apellido: <span th:text="${user.lastName}"></span></li>
	    <li>Fecha de alta: <span th:text="${#temporals.format(user.altaFecha, 'dd/MM/yyyy HH:mm')}"></span></li>
	</ul>
</body>
</html>
